<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tabela.css">
    <title>Tabelas</title>
</head>
<body>
    <h1>Mesclagem de Células</h1>
        <table>
            <thead>
                <tr></tr>
            </thead>
            <tbody>
                <tr>
                    <td>tetes</td>
                    <td>teste</td>
                    <td>teste</td>
                    <td>teste</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>A</td>
                    <td>B</td>
                    <td>C</td>
                    <td>D</td>
                </tr>
            </tbody>
        </table>
        <h1>Teste de Mesclagem de Células</h1>
        <table class="centro">
        <tbody>
            <tr>
                <td>A</td>
                <td colspan="2">B</td> <!--Expasao de coluna
                Colspan = preenche em horizontal 
                rowspan = preenche na vertical
                -->
            </tr>
            <tr>
                <td>D</td>
                <td>E</td>
                <td>F</td>
            </tr>
            <tr>
                <td>G</td>
                <td>H</td>
                <td>I</td>
            </tr>
            <tr>
                <td>J</td>
                <td>L</td>
                <td>M</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
